<!DOCTYPE html>
<html>
    <head>
        <title>Photo Gallery</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
        <style>
            /* Στυλ για την Gallery και τα κλικ στις φωτογραφίες */
            .gallery-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
                padding: 20px 0;
            }
            .gallery-container img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
                cursor: pointer;
                transition: transform 0.3s ease, opacity 0.3s ease;
            }
            .gallery-container img:hover {
                transform: scale(1.03);
                opacity: 0.9;
            }

            /* Το παράθυρο προβολής (Modal) όταν πατάς μια φωτογραφία */
            #imageModal {
                display: none;
                position: fixed;
                z-index: 10000;
                padding-top: 60px;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.9);
                text-align: center;
            }
            #modalImage {
                max-width: 90%;
                max-height: 80vh;
                margin: auto;
                display: block;
                border-radius: 5px;
            }
            #closeModal {
                position: absolute;
                top: 20px;
                right: 35px;
                color: #f1f1f1;
                font-size: 40px;
                font-weight: bold;
                cursor: pointer;
            }
            #closeModal:hover {
                color: #ffffff;
            }
        </style>
    </head>
    <body class="is-preload">

            <header id="header">

                <nav>

                        <li><a href="photo.html" class="active">Photo gallery</a></li>

</div>

            <script src="assets/js/main.js"></script>

            <!-- JavaScript για το άνοιγμα/κλείσιμο της φωτογραφίας -->
            <script>
                function openModal(element) {
                    var modal = document.getElementById("imageModal");
                    var modalImg = document.getElementById("modalImage");
                    modal.style.display = "block";
                    modalImg.src = element.src;
                }

                function closeModal() {
                    var modal = document.getElementById("imageModal");
                    modal.style.display = "none";
                }

                // Κλείσιμο και με το πλήκτρο ESC στο πληκτρολόγιο
                document.addEventListener('keydown', function(event) {
                    if (event.key === "Escape") {
                        closeModal();
                    }
                });
            </script>
